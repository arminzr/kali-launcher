name: ci

on:
  push:
    branches: [main, kali]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The NDK app/build.gradle.kts pins; installed up front so AGP doesn't download it mid-build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null

      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar

      # Builds with proot (scripts/fetch-proot.sh needs bsdtar), so the debug APK is installable.
      - name: Build and lint
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools
          ./scripts/fetch-proot.sh
          ./gradlew :app:assembleDebug :app:lintDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kali-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
